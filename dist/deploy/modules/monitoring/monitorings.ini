# Known monitoring pollers — used only when info_answer_scope = list.
# These addresses get A2S_INFO and info / details / players / rules answered
# directly; everyone else goes through Steam's challenge.
#
# One IPv4 address or CIDR per line, anything after it is a comment:
#   203.0.113.25        some-monitoring.example poller
#   198.51.100.0/24     a monitoring that polls from a whole subnet
#
# The poller's IP is usually NOT the IP of the monitoring's website. To find
# it, run a day with info_answer_scope = all and debug = 1: authum.log lists
# every source that got a direct answer. Edit this file, then
#   authum monitoring reload
# (no restart needed); `authum monitoring list` shows what is loaded.
