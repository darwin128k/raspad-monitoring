# monitoring — Authum module config
# Answers server-browser / monitoring queries that Steam now gates behind an
# A2S challenge, so old monitorings stop showing the server as offline.

# A2S_INFO ("TSource Engine Query") sent without a challenge:
#   steam  = leave it to Steam (replies 'A' challenge — old monitorings give up)
#   new    = answer 'I' right away (default)
#   old    = answer GoldSrc 'm' only
#   hybrid = 'I' followed by 'm' (what dproto/reunion called hybrid)
# Queries that already carry a challenge always go to Steam.
info_answer = new

# Who gets those direct answers (A2S_INFO above and the legacy queries below):
#   all  = any source, rate-limited per IP (default)
#   list = only the pollers in monitorings.ini; everyone else gets Steam's
#          challenge, so spoofed queries cannot be reflected through the server
# Edit the list, then `authum monitoring reload` — no restart.
info_answer_scope = all
monitorings = monitorings.ini

# Old text queries Steam ignores, answered by the engine's own handlers.
# None of them carries a challenge, so each answer can be aimed at a spoofed
# address; ratelimit_per_ip caps that per target.
#   legacy_info    'info'    -> 'C'  (~100 bytes)
#   legacy_details 'details' -> 'm'  (~150 bytes)
#   legacy_players 'players' -> 'D'  (grows with the player list)
#   legacy_rules   'rules'   -> 'E'  (several KB for a 10-byte query — off unless needed)
legacy_info = 1
legacy_details = 1
legacy_players = 1
legacy_rules = 0

# Address put into 'C' / 'm' (HLDS bound to every interface reports 0.0.0.0).
# Empty = the `ip` cvar; neither set = the engine's own value.
public_ip =

# Fields of the 'I' reply the engine does not know itself (match what Steam sends).
appid = 10
version = 1.1.2.7/Stdio

# Direct answers per source IP per second (0 = unlimited). Over the budget the
# query falls back to Steam. The engine's max_queries_* limits apply before this.
ratelimit_per_ip = 5

# 1 = log every query we answer (with source IP)
debug = 0

# 4 = authum.log only (default). 2 = private file, 6 = both.
logging_mode = 4
logging_split = full
