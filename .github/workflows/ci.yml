name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux i386 Authum package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib ninja-build cmake zip \
            libc6-dev:i386

      - name: Configure & build
        run: |
          cmake -S . -B build-linux32 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux32 --target monitoring -j"$(nproc)"

      - name: Pack Authum module layout
        run: |
          strip --strip-unneeded build-linux32/modules/monitoring/monitoring.so
          rm -rf dist-ci
          cmake --install build-linux32 --component monitoring --prefix dist-ci
          printf 'monitoring\n' > dist-ci/addons/authum/modules.list.example
          cat > dist-ci/addons/authum/modules/monitoring/INSTALL.txt <<'EOF'
          Unpack into the game dir so paths match Authum:

            addons/authum/modules/monitoring/monitoring.so
            addons/authum/modules/monitoring/monitoring.cfg
            addons/authum/modules/monitoring/monitorings.ini

          Ensure Authum is installed, then add a line to addons/authum/modules.list:
            monitoring

          Restart HLDS, then look for "hook installed on Steam_HandleIncomingPacket" in authum.log.
          EOF
          sed -i 's/^          //' dist-ci/addons/authum/modules/monitoring/INSTALL.txt
          (cd dist-ci && zip -r ../monitoring-linux32-authum.zip addons)
          ls -la monitoring-linux32-authum.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-linux32-authum
          path: monitoring-linux32-authum.zip
          if-no-files-found: error

  windows:
    name: Windows i686 (MSYS2 MinGW)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2 MINGW32
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            zip

      - name: Build
        run: |
          cmake -S . -B build-win32 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win32 --target monitoring -j"$(nproc)"

      - name: Pack Authum module layout
        run: |
          rm -rf dist-win
          cmake --install build-win32 --component monitoring --prefix dist-win
          printf 'monitoring\n' > dist-win/addons/authum/modules.list.example
          cat > dist-win/addons/authum/modules/monitoring/INSTALL.txt <<'EOF'
          Unpack into the game dir so paths match Authum:

            addons\authum\modules\monitoring\monitoring.dll
            addons\authum\modules\monitoring\monitoring.cfg
            addons\authum\modules\monitoring\monitorings.ini

          Ensure Authum is installed, then add a line to addons\authum\modules.list:
            monitoring
          EOF
          sed -i 's/^          //' dist-win/addons/authum/modules/monitoring/INSTALL.txt
          (cd dist-win && zip -r ../monitoring-win32-authum.zip addons)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-win32-authum
          path: monitoring-win32-authum.zip
          if-no-files-found: error
