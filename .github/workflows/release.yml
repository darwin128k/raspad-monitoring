name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      ref:
        description: 'Git ref to build'
        required: true
        default: master
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Authum module zip
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib ninja-build cmake zip \
            libc6-dev:i386

      - name: Build
        run: |
          cmake -S . -B build-linux32 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux32 --target monitoring -j"$(nproc)"

      - name: Pack Authum module layout
        run: |
          strip --strip-unneeded build-linux32/modules/monitoring/monitoring.so
          rm -rf dist-ci && mkdir -p dist-ci/addons/authum/modules/monitoring
          cp build-linux32/modules/monitoring/monitoring.so \
            dist-ci/addons/authum/modules/monitoring/monitoring.so
          cp monitoring.cfg dist-ci/addons/authum/modules/monitoring/monitoring.cfg
          cp monitoring_list.ini dist-ci/addons/authum/modules/monitoring/monitoring_list.ini
          printf 'monitoring\n' > dist-ci/addons/authum/modules.list.example
          cat > dist-ci/addons/authum/modules/monitoring/INSTALL.txt <<'EOF'
          Unpack into the game dir so paths match Authum:

            addons/authum/modules/monitoring/monitoring.so
            addons/authum/modules/monitoring/monitoring.cfg
            addons/authum/modules/monitoring/monitoring_list.ini

          Ensure Authum is installed, then add a line to addons/authum/modules.list:
            monitoring

          Restart HLDS, then look for "hook installed on Steam_HandleIncomingPacket" in authum.log.
          EOF
          sed -i 's/^          //' dist-ci/addons/authum/modules/monitoring/INSTALL.txt
          (cd dist-ci && zip -r ../monitoring-linux32-authum.zip addons)

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          NOTES=$(mktemp)
          python3 scripts/release_notes.py --tag "$TAG" \
            --package "Download **\`monitoring-linux32-authum.zip\`** and unpack → \`addons/authum/modules/monitoring/\` (needs Authum)." \
            --highlight "Authum module: monitorings see the server again (A2S_INFO without challenge, old info/details/players/rules)" \
            --highlight "Uses the engine's own SVC_Info, so player/bot count, password and VAC match the server" \
            --highlight "Add \`monitoring\` to \`addons/authum/modules.list\`" \
            > "$NOTES"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release edit "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" monitoring-linux32-authum.zip --clobber
